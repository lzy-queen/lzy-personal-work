<!doctype html>
<meta charset="utf-8">
<title>LZY-GRAB</title>
<body style="font:16px/1.6 system-ui;padding:24px;background:#0b0f19;color:#e8eaf0">
<h3 id="h">正在导出这台浏览器里存的视频…</h3>
<pre id="log" style="background:#131b2e;border:1px solid #1e293b;padding:12px;border-radius:8px;white-space:pre-wrap"></pre>
<script>
var HOST = 'http://127.0.0.1:8795';
var logEl = document.getElementById('log');
function log(s) { logEl.textContent += s + '\n'; }
var req = indexedDB.open('LZY_Portfolio_MediaDB', 1);
req.onupgradeneeded = function () { try { req.result.createObjectStore('media'); } catch (e) {} };
req.onerror = function () { log('open error: ' + req.error); };
req.onsuccess = function () {
  var db = req.result;
  var keys = [];
  var cur = db.transaction('media', 'readonly').objectStore('media').openCursor();
  cur.onerror = function () { log('cursor error ' + cur.error); };
  cur.onsuccess = function () {
    var c = cur.result;
    if (!c) { log('keys: ' + keys.length); dump(db, keys, 0); return; }
    keys.push(c.key);
    c.continue();
  };
};
function dump(db, keys, i) {
  if (i >= keys.length) { log('DONE'); fetch(HOST + '/finish'); return; }
  var k = keys[i];
  var rq = db.transaction('media', 'readonly').objectStore('media').get(k);
  rq.onsuccess = function () {
    var v = rq.result;
    if (!(v instanceof Blob)) { log('skip ' + k); dump(db, keys, i + 1); return; }
    log('upload ' + k + '  ' + (v.size / 1048576).toFixed(2) + ' MB  ' + (v.type || '?'));
    fetch(HOST + '/upload?key=' + encodeURIComponent(String(k)) +
          '&type=' + encodeURIComponent(v.type || '') + '&size=' + v.size,
          { method: 'POST', body: v })
      .then(function () { log('  ok ' + k); dump(db, keys, i + 1); })
      .catch(function (e) { log('  fail ' + k + ' ' + e); dump(db, keys, i + 1); });
  };
  rq.onerror = function () { log('get error ' + k); dump(db, keys, i + 1); };
}
</script>
